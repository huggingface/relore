# relore — chart defaults.
#
# This file is the *shape* of the configuration and safe defaults. It is NOT the
# deployment's values: those live in the operator's own repository and are passed
# with `-f`, because what is tracked here is a chart and what is tracked there is
# an environment. Nothing in this file is a credential, and nothing in it should
# become one — see `externalSecret` below.

# How much the daemon says. `relored` defaults to WARNING, which for a poll loop or
# a day-long backfill means **complete silence while it works** -- 180,000 objects
# staged and not one line of output, so the only way to tell a healthy run from a
# wedged one is to query the database. Every progress message it has is INFO.
#
# 0 = warnings only (the CLI default), 1 = -v / INFO, 2 = -vv / DEBUG.
verbosity: 1

image:
  repository: ghcr.io/huggingface/relore
  tag: latest
  pullPolicy: IfNotPresent

# Required whenever the image is private, which it is here: `huggingface/relore` is
# an *internal* repository, so its GHCR package is private and the kubelet gets a
# 401 pulling it anonymously. The other services in this cluster need none of this
# because their repositories -- and therefore their packages -- are public.
#
# Making the package public is not the shortcut it looks like: the image contains
# the installed source, so a public image publishes internal code.
imagePullSecrets: []

# The Secret every workload reads via envFrom. Produced by the external-secret
# operator (see below) or created by hand. Must carry GITHUB_TOKEN,
# RELORE_API_TOKENS and POSTGRES_PASSWORD.
# `ghlore-secrets`, not `relore-secrets`, after the 2026-09-14 rename: this names a live
# Secret that an external operator produces from a path the operator also owns. Renaming
# it here renames nothing in Infisical -- it just points the pods at a Secret that does
# not exist. Its KEYS moved with the code, though: `GHLORE_API_TOKENS` is now
# `RELORE_API_TOKENS`, so a deployment that uses bearer tokens must rename that key in
# its secret store too. A `trustNetwork: true` deployment empties it in the pod spec and
# is unaffected.
existingSecret: ghlore-secrets

# ---------------------------------------------------------------------------
# The database
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  # pgvector, not plain postgres: migration 2 creates the `vector` extension.
  # Nothing writes an embedding in v1 (section 6.1) — provisioning the column is
  # what keeps the vector tier a later decision rather than a migration nobody
  # can run.
  image: pgvector/pgvector:pg16
  # Both stay `ghlore` after the 2026-09-14 rename. The role and the database exist
  # inside the StatefulSet's PVC; changing these strings does not rename them, it points
  # the daemon at a database that was never created.
  user: ghlore
  database: ghlore
  persistence:
    # "" = the cluster's default StorageClass (EBS gp3 on the open-source cluster).
    storageClass: ""
    # Sized for the corpus, and `raw_objects` dominates it: build plan section 4
    # measures roughly 2–3 GB of JSONB for a large repository, and the derived
    # tables are a fraction of that. 20Gi holds a full transformers history with
    # room; a sample needs a tenth of it.
    size: 20Gi
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 4Gi}

# ---------------------------------------------------------------------------
# The API and the section 8 web UI
# ---------------------------------------------------------------------------
serve:
  # Read-only and stateless, so this may scale. It is 1 because the bottleneck is
  # Postgres, not the process.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# ---------------------------------------------------------------------------
# The poll loop — one Deployment per repository (section 5.2)
# ---------------------------------------------------------------------------
# Section 11's repository allowlist: an allowlist, never a denylist, because a
# denylist is one forgotten entry away from publishing private discussion into a
# public answer. It is re-checked per thread.
#
# **Separate from `poll.repos` on purpose**, and conflating them was a bug. What may
# be *searched* and what gets a *poller* are different questions: a sampled corpus
# has to be searchable without being polled (see below), and defaulting one to the
# other silently made a bounded corpus unsearchable the moment its poller was
# removed. Empty means "whatever is polled", which is right only when every indexed
# repository is a full history.
allowedRepos: []

poll:
  #
  # **A repository listed here gets its FULL history.** With no high-water mark
  # `poll` walks from the start (`ingest/poll.py`: "no high-water mark yet, walking
  # from the start"), and section 5.5 is explicit that `relored sample` checkpoints
  # under its own pass name and deliberately does **not** move the `threads` mark --
  # so sampling a repository first does not bound its poller either. That is by
  # design: the shared mark must never claim to cover years nobody walked.
  #
  # The consequence for this chart is blunt: **do not list a repository you only
  # want a sample of.** Sampling is a one-off `relored sample --since`, and a sampled
  # corpus stays current by re-running it, not by polling. Listing one here quietly
  # converts a bounded corpus into a full backfill -- a day of API budget for a large
  # repository, and a corpus that no longer matches the window section 10's numbers
  # were measured against.
  repos: []
  interval: 5m
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

# ---------------------------------------------------------------------------
# The per-PR detail pass, on a schedule
# ---------------------------------------------------------------------------
# `relored backfill --only files` over every repository in `poll.repos`.
#
# It exists because the poller does NOT stage per-PR detail -- it runs the
# `threads` pass only -- so diff stats, `merged_by` and GraphQL-only reviews stop
# arriving the moment a backfill finishes. Five days after the transformers
# backfill, 199 of the 204 PRs touched since had no changed-file rows, which is
# `search --file` answering from a column that stopped five days ago.
#
# Cheap by construction: the pass skips PRs whose detail is already staged, so a
# run costs what was merged since the last one. Enabled by default for that reason
# -- a gap that closes daily rather than when somebody remembers.
#
# It does not cover OPEN pull requests: the pass walks merged ones only. That is
# huggingface/relore#48 and it needs a code change, not a schedule.
files:
  enabled: true
  # After the nightly backup (03:00) rather than alongside it: both touch the same
  # database, and the dump is the one that must not be slowed down.
  schedule: "0 4 * * *"
  historyLimit: 3
  # The pass is resumable and re-entrant, so a retry re-covers the remainder.
  backoffLimit: 2
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

# Section 6.2's bot-account list. `user.type == "Bot"` catches the accounts GitHub
# knows are apps; these are the ones it does not. `HuggingFaceDocBuilderDev`
# presents as `User` / `MEMBER`, so without listing it that account's boilerplate
# is admissible evidence. A deployment that indexes its own agent's comments and
# leaves this empty has reintroduced what section 11 refused.
botAccounts: []

# How the API is reached, and by whom.
api:
  # `--trust-network`: serve with no bearer token because the only route to this port is
  # a private network. **Off in the chart**, on in a deployment that has one, and that
  # asymmetry is the point: a release which loses its token configuration must refuse to
  # start rather than start open, so the permission is a values decision somebody typed.
  #
  # What it trades is narrow. Every response is read-only (section 11: the API's
  # connection is SELECT-only on both dialects), and the corpus is public GitHub history,
  # so the confidentiality being given up is one the source data never had. The write --
  # section 8's labelling -- is still gated on a configured path.
  #
  # When it is on, `RELORE_API_TOKENS` is emptied in the pod spec, so a stale token in
  # the secret store cannot quietly put authentication back.
  trustNetwork: false

# Section 8's relevance judgements, which section 15 calls the one thing only real
# use can produce. A PVC rather than an emptyDir so a pod restart does not discard
# what somebody spent an afternoon labelling.
# Section 6.1's semantic leg. Empty turns it off everywhere. The image carries
# BAAI/bge-small-en-v1.5; another model needs an image that bakes it in. Serve then
# holds ~400 MiB more and each poll pod ~1.7 GiB while it embeds, so raise
# poll.resources.limits.memory to 3Gi when turning this on. Backfill once with
# `deploy/scripts/pass.sh embed --repo OWNER/NAME`; `relored status` shows coverage.
embed:
  model: ""

labels:
  enabled: true
  # `/var/lib/ghlore`, not `relore`, after the 2026-09-14 rename: it is a path inside the
  # live volume. Moving it would hide the labels already written there, and section 15
  # calls human-judged ground truth the one thing only real use can produce.
  path: /var/lib/ghlore/labels.jsonl
  storageClass: ""
  size: 1Gi

# Issue #7's working clone, one checkout per repository, read by `symbol`, `grep`,
# `copies` and `defs`/`refs --repo`. `relored clone --repo owner/name`, exec'd
# into the serve pod, is both the create and the refresh; until it runs those verbs
# answer 503 naming it and nothing else notices.
clones:
  enabled: true
  # `relore/code/clone.py` defaults to the same path. Setting it here is what makes the
  # pod agree with the code rather than happen to match it.
  path: /var/lib/ghlore/clones
  # How often `serve` re-fetches them (30s, 5m, 2h). Empty means never, and then HEAD is
  # as old as the last `relored clone` -- `grep` and `copies` still answer, about that
  # tree. In `serve` and not a CronJob because the PVC is ReadWriteOnce and that pod
  # holds it.
  refresh: 1h
  storageClass: ""
  # Complete clones, so blame answers locally: transformers measures ~800MB against
  # ~180MB filtered. 10Gi is the three repositories several times over.
  size: 10Gi

migrate:
  backoffLimit: 3
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# ---------------------------------------------------------------------------
# Backups
# ---------------------------------------------------------------------------
# Worth less than it looks and more than it looks, for different tables. The index
# is derived: `derive` rebuilds it from `raw_objects` with no network, so losing it
# costs CPU. `raw_objects` costs a day of API budget. `documents_history` (section
# 14.1) cannot be re-fetched at any price — GitHub no longer serves the text.
backups:
  enabled: true
  schedule: "0 3 * * *"
  keep: 7
  historyLimit: 3
  storageClass: ""
  size: 40Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  host: ""
  path: /
  pathType: Prefix
  className: ""
  annotations: {}
  tls: []

# ---------------------------------------------------------------------------
# Secrets, from whatever operator the environment runs
# ---------------------------------------------------------------------------
externalSecret:
  enabled: false
  name: ""
  apiVersion: ""
  kind: ""
  spec: {}

# Anything else the daemon reads from the environment.
extraEnv: {}
